services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_HOST_PORT}:5432"
    volumes:
      - cryfio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL","pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - cryfio_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  garage:
    image: dxflrs/garage:v2.5.0
    command:
      - /garage
      - server
      - --single-node
      - --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET}
    ports:
      - "127.0.0.1:${GARAGE_S3_PORT}:3900"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - cryfio_garage_meta:/var/lib/garage/meta
      - cryfio_garage_data:/var/lib/garage/data

volumes:
  cryfio_postgres_data:
  cryfio_redis_data:
  cryfio_garage_meta:
  cryfio_garage_data: